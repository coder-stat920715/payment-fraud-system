version: "3.8"

# ---------------------------------------------------------------------------
# Real-Time Payment & Fraud Processing System - Local Infrastructure
#
# WHY KRaft mode (no Zookeeper)?
#   - Kafka 3.x+ / Confluent 7.x+ supports KRaft (Kafka Raft) as the metadata
#     quorum, removing the Zookeeper dependency entirely. This is what modern
#     production clusters (and interviewers) expect you to know in 2025+.
#   - Fewer moving parts, faster startup, and it's the direction Confluent /
#     Apache Kafka has fully committed to (ZK removed as of Kafka 4.0).
# ---------------------------------------------------------------------------

networks:
  payment-fraud-net:
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
  redis-data:

services:

  # -------------------------------------------------------------------------
  # Kafka Broker (KRaft mode - acts as both broker and controller)
  # -------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"   # host clients
      - "9101:9101"   # JMX
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Replication factor = 1 because this is a single-node local cluster.
      # In production this MUST be >= 3 with min.insync.replicas=2 for the
      # acks=all idempotent/transactional producer guarantees to mean anything.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly via KafkaAdmin beans
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - payment-fraud-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # -------------------------------------------------------------------------
  # Confluent Schema Registry - governs Avro schema compatibility for all
  # producers/consumers in this system.
  # -------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # BACKWARD is the Confluent default: new schema can read data written
      # with the previous schema. We set it explicitly here for clarity -
      # see README.md "Schema Evolution Strategies" for the full breakdown.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    networks:
      - payment-fraud-net

  # -------------------------------------------------------------------------
  # Kafka UI - optional but invaluable for demoing topics/partitions/consumer
  # lag during an interview walkthrough.
  # -------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    networks:
      - payment-fraud-net

  # -------------------------------------------------------------------------
  # Redis - backs the Idempotent Consumer Pattern (SETNX-based dedup) and
  # can also double as a cache for hot user-balance lookups.
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - payment-fraud-net

  # -------------------------------------------------------------------------
  # PostgreSQL - system of record for payments + the transactional Outbox
  # table (see pattern/outbox package).
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: payment_fraud_db
      POSTGRES_USER: payment_app
      POSTGRES_PASSWORD: payment_app_pwd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - payment-fraud-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_app -d payment_fraud_db"]
      interval: 5s
      timeout: 5s
      retries: 10
